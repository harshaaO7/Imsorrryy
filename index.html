  const x=s.x-p*W*.35,y=s.y+p*H*.2;h.strokeStyle=`rgba(255,235,170,${1-p})`;h.lineWidth=4;h.lineCap='round';h.beginPath();h.moveTo(x,y);h.lineTo(x+W*.07,y-H*.025);h.stroke()}}
requestAnimationFrame(frame);
/* audio */
let AC,mg,music=true,voiceOn=true,voice;
function bell(f,v=.1){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),q=AC.createGain();o.frequency.value=f;q.gain.setValueAtTime(0,t);q.gain.linearRampToValueAtTime(v,t+.02);q.gain.exponentialRampToValueAtTime(.0001,t+2.2);o.connect(q);q.connect(mg);o.start(t);o.stop(t+2.3)}
function chime(){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>setTimeout(()=>bell(f,.16),i*140))}
function startAudio(){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=0;const lp=AC.createBiquadFilter();lp.frequency.value=1400;mg.connect(lp);lp.connect(AC.destination);mg.gain.linearRampToValueAtTime(.12,AC.currentTime+3);
 const ch=[[110,220,261.63,329.63],[87.31,174.61,220,261.63],[98,196,246.94,293.66],[82.41,164.81,207.65,246.94]];let ci=0;
 const pad=()=>{const t=AC.currentTime;ch[ci++%4].forEach(f=>{const o=AC.createOscillator(),q=AC.createGain();o.frequency.value=f;q.gain.setValueAtTime(0,t);q.gain.linearRampToValueAtTime(.22,t+2.5);q.gain.linearRampToValueAtTime(0,t+8.5);o.connect(q);q.connect(mg);o.start(t);o.stop(t+9)})};pad();setInterval(pad,8000);
 const nt=[659.25,783.99,880,987.77,1174.66,1318.5];setInterval(()=>{if(R()<.55)bell(nt[(R()*6)|0],.1)},1500)}catch(e){}}
function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();voice=v.find(x=>/^en/i.test(x.lang)&&/(daniel|aaron|alex|david|james|male)/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){return new Promise(res=>{const est=Math.max(1800,t.length*62);if(!voiceOn||!('speechSynthesis' in window)){setTimeout(res,est);return}
 try{const u=new SpeechSynthesisUtterance(t.replace(/…/g,'...'));if(voice)u.voice=voice;u.rate=.9;u.pitch=.95;let d=0;const f=()=>{if(!d){d=1;res()}};u.onend=f;u.onerror=f;speechSynthesis.speak(u);setTimeout(f,est+t.length*45+4000)}catch(e){setTimeout(res,est)}})}
/* text */
const Lb=$('lt'),X=$('tx');let skip=null;
async function line(t,hold=900){
 Lb.classList.remove('on');await sleep(300);X.textContent='';Lb.classList.add('on');
 let sk=false;const sp=new Promise(r=>skip=()=>{sk=true;r()});
 const ty=new Promise(r=>{let i=0;const id=setInterval(()=>{if(sk){clearInterval(id);r();return}X.textContent=t.slice(0,++i);if(i>=t.length){clearInterval(id);r()}},38)});
 await Promise.race([Promise.all([ty,speak(t)]),sp]);X.textContent=t;
 if(sk){try{speechSynthesis.cancel()}catch(e){}await sleep(400)}else await Promise.race([sleep(hold),sp]);skip=null}
const hide=()=>Lb.classList.remove('on');
async function blk(t,min){$('bt').textContent=t;$('blk').classList.add('on');setTimeout(()=>speak(t),1300);await sleep(min)}
async function blkOff(){$('blk').classList.remove('on');await sleep(1200)}
function askFinal(){return new Promise(res=>{const p=$('ask'),b=$('bt2');$('as').textContent='After all of it…';$('ab').textContent='Will you be my girlfriend?';b.innerHTML='';
 const mk=(l,c,fn)=>{const e=document.createElement('button');e.className='opt '+c;e.textContent=l;e.addEventListener('click',fn);b.appendChild(e);return e};
 const done=()=>{p.classList.remove('on');setTimeout(res,700)};
 mk('Yes, forever 💙','',done);mk('Yes, headache and all 😌','',done);let n=0;
 const dg=mk('Let me think… 🤔','d',e=>{n++;dg.textContent=['Too slow 😏','Hmm… still thinking…','Okay, okay… fine, yes 💙'][Math.min(n-1,2)];
  if(n>=3){dg.classList.remove('d');dg.style.transform='none';dg.addEventListener('click',done,{once:true});return}
  dg.style.transform=`translate(${(R()-.5)*120}px,${(R()-.5)*20}px) rotate(${(R()-.5)*10}deg)`});
 p.classList.add('on');speak('Will you be my girlfriend?')})}

 scn('start',9000);await sleep(1500);
 await line("Once upon a random day…");

 scn('bigrose',14000);await line("Every petal, a memory.");await line("Every thorn, a lesson. Every bloom… is us.");

 ringS=0;ringTw();chime();await line("So I know it's obvious. But I still want to ask you.");

 scn('hug',14000);await sleep(1800);
 await line("Thank you. For every high, every low, and every day you chose me.",1600);hide();

 $('so').textContent='Forever yours, '+CFG.from+(CFG.her?' & '+CFG.her:'');$('fin').classList.add('on');chime();speak('Forever.');

$('bm').onclick=e=>{music=!music;e.currentTarget.classList.toggle('off',!music);if(mg)mg.gain.setTargetAtTime(music?.12:0,AC.currentTime,.3)};

$('go').addEventListener('click',()=>{startAudio();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}
 const i=$('intro');i.style.opacity=0;i.style.pointerEvents='none';$('bar').classList.add('on');setTimeout(()=>i.style.display='none',1700);setTimeout(story,900)},{once:true});
